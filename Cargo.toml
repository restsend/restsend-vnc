[package]
name = "restsend-vnc"
version = "0.2.2"
edition = "2021"
description = "A headless, cross-platform (macOS/Windows) VNC server CLI"
license = "MIT"
repository = "https://github.com/restsend/restsend-vnc"

[features]
default = ["gui"]
gui = []

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
des = "0.8"
cipher = "0.4"
getrandom = "0.3"
rpassword = "7"
thiserror = "2"
arboard = { version = "3", default-features = false }
num-bigint = "0.4"
md-5 = "0.10"
aes = "0.8"
sha1 = "0.10"
hex = "0.4"
socket2 = "0.5"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
polling = "3"
rayon = "1.10"

[target.'cfg(target_os = "windows")'.dependencies]
scap = "0.0.8"
# scap 0.0.8's Windows engine only compiles against windows-capture 1.4.x;
# pin it explicitly so a transitive bump can't break the build.
windows-capture = "=1.4.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# windows-capture 1.4.2 uses isize bit ops that do not compile for i686;
# vendored with a two-line 32-bit fix so win32 builds work too.
[patch.crates-io]
windows-capture = { path = "vendor/windows-capture" }
