# Windows builds are fully self-contained: statically link the CRT so the
# produced .exe has no dependency on vcruntime140.dll / msvcrt.dll / any
# bundled DLL — only system DLLs that ship with Windows itself.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

# `cargo check --target x86_64-pc-windows-msvc` works without an MSVC
# toolchain (Rust requires a linker only at build time).
